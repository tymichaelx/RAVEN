[project]
name = "raven"
version = "0.1.0"
description = "Retrieve-then-verify ATT&CK technique extraction with small encoders"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "nltk>=3.10.4",
    "numpy==2.5.5",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "tabulate>=0.10.0",
    "torch>=2.15.0",
    "transformers==5.23.0",
    "wordcloud>=1.9.6",
    "ollama>=0.6.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
